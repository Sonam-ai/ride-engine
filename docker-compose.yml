services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridehailing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ridehailing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ridehailing
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      SIMULATION_AUTOSTART: "true"
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["5173:80"]

  simulator:
    profiles: ["load"]
    build: ./simulator
    depends_on:
      backend: { condition: service_healthy }
    environment:
      BACKEND_API_URL: http://backend:8000

volumes:
  pgdata:
  redisdata: