services:
  - type: web
    name: ride-engine-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: REDIS_URL
        value: memory
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./rides.db
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: SIMULATION_AUTOSTART
        value: "true"
      - key: https://ride-engine.netlify.app,http://localhost:5173
        value: http://localhost:5173
